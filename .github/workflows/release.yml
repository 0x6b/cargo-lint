name: Release bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    container:
      image: debian@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build environment
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential ca-certificates curl git

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source release/versions.env
          "$HOME/.cargo/bin/rustup" toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Build bundle
        run: scripts/build-release-bundle.sh dist

      - name: Verify fixed checksum and contents
        run: scripts/verify-release-bundle.sh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-lint-v0.1.1-x86_64-unknown-linux-gnu
          path: |
            dist/cargo-lint-v0.1.1-x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Verify tag matches bundle version
        if: github.ref_type == 'tag'
        run: |
          source release/versions.env
          test "$GITHUB_REF_NAME" = "$BUNDLE_VERSION"

  release:
    if: github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cargo-lint-v0.1.1-x86_64-unknown-linux-gnu
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            dist/cargo-lint-v0.1.1-x86_64-unknown-linux-gnu.tar.gz \
            dist/SHA256SUMS
